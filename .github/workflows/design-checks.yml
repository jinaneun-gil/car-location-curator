name: Design checks
on:
  push:
    paths: ['prototype/**', 'android/**', 'design/**', '.github/workflows/design-checks.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android unit tests and APK
        run: gradle -p android :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: map-first-apk
          path: android/app/build/outputs/apk/release/app-release.apk
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node prototype/a/planner.test.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node design/smoke.cjs
